name: BCBid Weekly Scrape

on:
  schedule:
    - cron: '0 15 * * 2'   # 7 AM PT Tuesday
  workflow_dispatch:

concurrency:
  group: pipeline

jobs:
  bcbid:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Cache Patchright Chromium binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: patchright-${{ runner.os }}-v1

      - name: Install Patchright Chromium (if not cached)
        run: python -m patchright install chromium

      - name: Find latest DB artifact run
        id: latest-artifact
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'opportunity-db',
              per_page: 5,
            });
            const valid = artifacts.data.artifacts.filter(a => !a.expired);
            if (valid.length > 0) {
              core.setOutput('run_id', String(valid[0].workflow_run.id));
              core.setOutput('found', 'true');
            } else {
              core.setOutput('found', 'false');
            }

      - uses: actions/download-artifact@v4
        if: steps.latest-artifact.outputs.found == 'true'
        with:
          name: opportunity-db
          path: data/
          run-id: ${{ steps.latest-artifact.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Decode BCBid session (if secret present)
        run: |
          if [ -n "$BCBID_SESSION" ]; then
            echo "$BCBID_SESSION" | base64 -d > bcbid_session.json
            echo "BCBid session file written"
          else
            echo "BCBID_SESSION not set — running without persisted session"
          fi
        env:
          BCBID_SESSION: ${{ secrets.BCBID_SESSION }}

      - run: python main.py bcbid
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_SENDER: ${{ secrets.DIGEST_SENDER }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          AGENT_TIMEOUT_SECONDS: 120
          BCBID_SESSION: ${{ secrets.BCBID_SESSION }}

      - name: Inspect DB state
        run: |
          python - <<'EOF'
          import sqlite3, os
          db = os.environ.get("DB_PATH", "data/opportunities.db")
          if not os.path.exists(db):
              print("DB not found")
          else:
              conn = sqlite3.connect(db)
              rows = conn.execute(
                  "SELECT recommendation, COUNT(*) FROM opportunities GROUP BY recommendation"
              ).fetchall()
              total = conn.execute("SELECT COUNT(*) FROM opportunities").fetchone()[0]
              unsent = conn.execute(
                  "SELECT COUNT(*) FROM opportunities WHERE sent_in_digest=0 AND recommendation IN ('PURSUE','CONSIDER')"
              ).fetchone()[0]
              print(f"Total opportunities: {total}")
              for rec, cnt in rows:
                  print(f"  {rec}: {cnt}")
              print(f"Unsent PURSUE/CONSIDER (digest-ready): {unsent}")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: opportunity-db
          path: data/opportunities.db
          retention-days: 90
          overwrite: true
          if-no-files-found: warn
